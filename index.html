<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夏文韬·个人博客</title>
    <!-- 引入 Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: #1e293b;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            padding: 32px;
            border-radius: 40px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            align-items: start;
        }

        /* ===== 左侧：个人名片 ===== */
        .profile {
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 30px 20px;
            border-radius: 28px;
            backdrop-filter: blur(4px);
        }
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 16px;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .profile .tagline {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 14px;
        }
        .profile .bio {
            font-size: 0.9rem;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 20px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .social-links a {
            text-decoration: none;
            background: white;
            padding: 5px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }
        .social-links a:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            transform: translateY(-2px);
        }

        /* ===== 右侧：博客内容 ===== */
        .main-content {
            min-width: 0;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header-bar h2 {
            font-weight: 600;
            font-size: 1.3rem;
        }
        #backBtn {
            display: none;
            background: none;
            border: none;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 30px;
            background: rgba(37, 99, 235, 0.08);
        }
        #backBtn.show {
            display: block;
        }

        /* 文章列表卡片 */
        .post-item {
            background: white;
            padding: 18px 24px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 14px;
            border: 1px solid rgba(0, 0, 0, 0.02);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .post-item:hover {
            transform: translateX(6px);
            border-color: #bfdbfe;
            box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.1);
        }
        .post-item h3 {
            font-weight: 600;
            margin-bottom: 2px;
        }
        .post-item .meta {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .post-item .desc {
            margin-top: 8px;
            color: #475569;
            font-size: 0.9rem;
        }

        /* 文章详情（默认隐藏） */
        #postView {
            display: none;
        }
        #postView.active {
            display: block;
        }
        #postView .post-body {
            background: white;
            padding: 32px 36px;
            border-radius: 24px;
            line-height: 1.8;
        }
        #postView .post-body h1 {
            font-size: 2rem;
            margin-bottom: 4px;
        }
        #postView .post-body pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
        }
        #postView .post-body blockquote {
            border-left: 4px solid #2563eb;
            padding-left: 20px;
            color: #475569;
            margin: 16px 0;
        }
        #postView .post-meta {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* 响应式：手机变一列 */
        @media (max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            .profile {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== 左侧：个人信息 ===== -->
        <aside class="profile">
            <div class="avatar">
                <!-- 👇 1. 改这里：把 avatar.jpg 换成你自己的图片文件名 -->
                <img src="images/avatar.jpg" alt="头像" />
            </div>
            <!-- 👇 2. 改这里：改成你的名字 -->
            <h1>夏文韬</h1>
            <!-- 👇 3. 改这里：你的职业/标签 -->
            <p class="tagline">🧑‍💻 普通大学生 · 内容创作者</p>
            <!-- 👇 4. 改这里：一段关于你的简介 -->
            <p class="bio">热爱技术、阅读与写作。相信分享是最高效的学习方式。</p>
            <div class="social-links">
                <!-- 👇 5. 改这里：替换成你的社交链接 -->
                <a href="#">GitHub</a>
                <a href="#">📧 邮箱</a>
            </div>
        </aside>

        <!-- ===== 右侧：文章区域 ===== -->
        <main class="main-content">
            <div class="header-bar">
                <h2 id="viewTitle">📖 文章目录</h2>
                <button id="backBtn">← 返回目录</button>
            </div>

            <!-- 文章列表 -->
            <div id="homeView">
                <div id="postList"></div>
            </div>

            <!-- 文章详情 -->
            <div id="postView">
                <div class="post-body">
                    <h1 id="detailTitle"></h1>
                    <div class="post-meta" id="detailMeta"></div>
                    <div id="detailContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        //  1. 📚 文章目录数据（在这里添加你的文章索引）
        // ============================================================
        const POSTS = [
            // 👇 6. 改这里：按照这个格式，把你的文章信息填进来
            {
                "id": "hello-world",
                "title": "Hello World，我的第一篇博客",
                "date": "2026-07-30",
                "desc": "聊聊搭建这个个人网站的初衷，以及未来的写作计划。"
            },
            // 如果你有第二篇，继续往下加
            // {
            //     "id": "second-article",
            //     "title": "第二篇文章的标题",
            //     "date": "2026-07-31",
            //     "desc": "这篇文章的简短描述。"
            // }
        ];

        // ============================================================
        //  2. 渲染逻辑（不用改，直接复制）
        // ============================================================
        const homeView = document.getElementById('homeView');
        const postView = document.getElementById('postView');
        const postList = document.getElementById('postList');
        const backBtn = document.getElementById('backBtn');
        const viewTitle = document.getElementById('viewTitle');

        function renderHome() {
            homeView.style.display = 'block';
            postView.classList.remove('active');
            backBtn.classList.remove('show');
            viewTitle.textContent = '📖 文章目录';

            if (POSTS.length === 0) {
                postList.innerHTML = `<p style="color:#94a3b8;padding:20px;">暂无文章，快去写一篇吧 ✍️</p>`;
                return;
            }
            postList.innerHTML = POSTS.map(p => `
                        <div class="post-item" onclick="openPost('${p.id}')">
                            <h3>${p.title}</h3>
                            <div class="meta">📅 ${p.date}</div>
                            <div class="desc">${p.desc}</div>
                        </div>
                    `).join('');
        }

        window.openPost = async function(id) {
            const post = POSTS.find(p => p.id === id);
            if (!post) return;

            try {
                // 自动去 posts/ 文件夹下读取对应的 .md 文件
                const res = await fetch(`posts/${id}.md`);
                if (!res.ok) throw new Error('文件不存在');
                const md = await res.text();
                const html = marked.parse(md);

                document.getElementById('detailTitle').textContent = post.title;
                document.getElementById('detailMeta').textContent = `📅 ${post.date}`;
                document.getElementById('detailContent').innerHTML = html;
            } catch (e) {
                // 如果没写 .md 文件，显示占位提醒
                document.getElementById('detailTitle').textContent = post.title;
                document.getElementById('detailMeta').textContent = `📅 ${post.date}`;
                document.getElementById('detailContent').innerHTML = `
                            <p>✍️ 这篇内容正在撰写中...</p>
                            <p>请在 <code>posts/${id}.md</code> 中写入你的 Markdown 内容。</p>
                        `;
            }

            homeView.style.display = 'none';
            postView.classList.add('active');
            backBtn.classList.add('show');
            viewTitle.textContent = '📄 阅读文章';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        backBtn.addEventListener('click', renderHome);

        // 页面加载时渲染
        renderHome();
    </script>

</body>
</html>
