<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">加载中...</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 样式与之前完全相同，省略以节省篇幅，请复制你之前的 style 部分 */
        /* 如果你需要完整文件，我可以再次贴出，但建议只替换 JS 部分 */
    </style>
</head>
<body>
    <!-- HTML 结构保持不变 -->
    <div class="container">
        <aside class="profile" id="profileContainer"></aside>
        <main class="main-content">
            <!-- 与之前相同 -->
        </main>
    </div>

    <script>
        // ============================================================
        //  修复版 JS
        // ============================================================

        let currentLang = 'zhs';
        let langData = null;
        let profileData = null;
        let manifestPosts = null;
        let POSTS = [];

        // -------- 主题切换（不变） --------
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        function setTheme(theme) {
            htmlElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);
        themeToggle.addEventListener('click', () => {
            const current = htmlElement.getAttribute('data-theme') || 'dark';
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        // -------- 工具函数 --------
        function getLangFromURL() {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang');
            return (lang === 'zhs' || lang === 'zht' || lang === 'eng') ? lang : 'zhs';
        }

        async function loadLang() {
            const res = await fetch('config/lang.json');
            if (!res.ok) throw new Error(`无法加载 config/lang.json (HTTP ${res.status})`);
            return await res.json();
        }

        async function loadProfile() {
            const res = await fetch('config/profile.json');
            if (!res.ok) throw new Error(`无法加载 config/profile.json (HTTP ${res.status})`);
            return await res.json();
        }

        async function loadManifest() {
            const res = await fetch('posts/manifest.json');
            if (!res.ok) throw new Error(`无法加载 posts/manifest.json (HTTP ${res.status})`);
            return await res.json();
        }

        function getText(obj) {
            if (typeof obj === 'string') return obj;
            if (obj && typeof obj === 'object') {
                return obj[currentLang] || obj['zhs'] || '';
            }
            return '';
        }

        // -------- 修复后的 renderProfile --------
        function renderProfile() {
            const container = document.getElementById('profileContainer');

            if (!langData || !profileData) {
                container.innerHTML = `<p style="color: var(--text-muted);">⏳ 配置加载中...</p>`;
                return;
            }

            const p = langData.profile || {};
            const socials = profileData.social || [];

            const socialHtml = socials.map(s => {
                const labelObj = langData.social_labels && langData.social_labels[s.id];
                const label = labelObj ? getText(labelObj) : s.id;
                return `<a href="${s.url || '#'}" target="_blank">${label}</a>`;
            }).join('');

            container.innerHTML = `
                <div class="avatar">
                    <img src="${profileData.avatar || 'images/avatar.jpg'}" alt="头像" />
                </div>
                <h1>${getText(p.name) || '未命名'}</h1>
                <p class="tagline">${getText(p.tagline) || ''}</p>
                <p class="bio">${getText(p.bio) || ''}</p>
                <div class="social-links">${socialHtml}</div>
            `;
        }

        // -------- 其他渲染函数（不变） --------
        function updatePostsForCurrentLang() {
            if (!manifestPosts) return;
            POSTS = manifestPosts.map(item => ({
                id: item.id,
                date: item.date,
                title: item.title,
                desc: item.desc
            }));
        }

        function renderHome() {
            document.getElementById('homeView').style.display = 'block';
            document.getElementById('postView').classList.remove('active');
            document.getElementById('backBtn').classList.remove('show');
            document.getElementById('backBtn').textContent = getText(langData.back_button);
            document.getElementById('viewTitle').textContent = getText(langData.nav_title);

            const list = document.getElementById('postList');
            if (POSTS.length === 0) {
                list.innerHTML = `<p style="color:var(--text-light);padding:20px;">${getText(langData.no_posts)}</p>`;
                return;
            }
            list.innerHTML = POSTS.map(p => `
                <div class="post-item" onclick="openPost('${p.id}')">
                    <h3>${p.title}</h3>
                    <div class="meta">📅 ${p.date}</div>
                    <div class="desc">${p.desc}</div>
                </div>
            `).join('');
        }

        window.openPost = async function(id) {
            const post = POSTS.find(p => p.id === id);
            if (!post) return;
            try {
                const res = await fetch(`posts/${id}.md`);
                if (!res.ok) throw new Error('文件不存在');
                const md = await res.text();
                const html = marked.parse(md);
                document.getElementById('detailTitle').textContent = post.title;
                document.getElementById('detailMeta').textContent = `📅 ${post.date}`;
                document.getElementById('detailContent').innerHTML = html;
            } catch (e) {
                document.getElementById('detailTitle').textContent = post.title;
                document.getElementById('detailMeta').textContent = `📅 ${post.date}`;
                document.getElementById('detailContent').innerHTML = `
                    <p>✍️ ${getText(langData.no_posts)}</p>
                    <p>请在 <code>posts/${id}.md</code> 中写入内容。</p>
                `;
            }
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('postView').classList.add('active');
            document.getElementById('backBtn').classList.add('show');
            document.getElementById('backBtn').textContent = getText(langData.back_button);
            document.getElementById('viewTitle').textContent = getText(langData.reading_title);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        document.getElementById('backBtn').addEventListener('click', renderHome);

        // -------- 语言切换（已包含返回按钮修复） --------
        async function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.history.pushState({}, '', url);

            renderProfile();
            updatePostsForCurrentLang();
            const postView = document.getElementById('postView');
            if (postView.classList.contains('active')) {
                const titleEl = document.getElementById('detailTitle');
                const currentTitle = titleEl.textContent;
                const matched = POSTS.find(p => p.title === currentTitle);
                if (matched) {
                    titleEl.textContent = matched.title;
                    document.getElementById('detailMeta').textContent = `📅 ${matched.date}`;
                }
                document.getElementById('backBtn').textContent = getText(langData.back_button);
                document.getElementById('viewTitle').textContent = getText(langData.reading_title);
            } else {
                renderHome();
            }
            document.title = getText(langData.site_title);
            document.querySelectorAll('.lang-switch button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        // -------- 初始化（增强错误处理） --------
        async function init() {
            try {
                langData = await loadLang();
                profileData = await loadProfile();
                manifestPosts = await loadManifest();

                const initialLang = getLangFromURL();
                currentLang = initialLang;
                updatePostsForCurrentLang();
                renderProfile();
                renderHome();
                document.title = getText(langData.site_title);

                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === initialLang);
                });
                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        switchLanguage(btn.dataset.lang);
                    });
                });
                window.addEventListener('popstate', () => {
                    const newLang = getLangFromURL();
                    if (newLang !== currentLang) {
                        switchLanguage(newLang);
                    }
                });
            } catch (e) {
                console.error('初始化失败:', e);
                document.getElementById('profileContainer').innerHTML = `
                    <p style="color: #ef4444; padding: 20px;">
                        ⚠️ 加载配置失败，请检查控制台错误信息。<br>
                        <small style="font-size:0.8rem;">${e.message}</small>
                    </p>
                `;
                // 尝试显示文章列表（可能为空）
                renderHome();
            }
        }

        init();
    </script>
</body>
</html>
