<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">加载中...</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ============================================================
           全局 CSS 变量（亮色/深色）
           ============================================================ */
        :root {
            --bg-body: #f4f7fb;
            --bg-container: rgba(255, 255, 255, 0.75);
            --border-container: rgba(255, 255, 255, 0.8);
            --shadow-container: 0 20px 50px -12px rgba(0, 0, 0, 0.15);
            --bg-profile: rgba(255, 255, 255, 0.5);
            --text-primary: #1e293b;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --card-bg: white;
            --card-border: rgba(0, 0, 0, 0.02);
            --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            --card-hover-border: #bfdbfe;
            --card-hover-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.1);
            --link-color: #2563eb;
            --link-hover-bg: #2563eb;
            --btn-bg: white;
            --btn-border: #e2e8f0;
            --btn-hover-bg: #2563eb;
            --code-bg: #0f172a;
            --code-text: #e2e8f0;
            --blockquote-border: #2563eb;
            --blockquote-text: #475569;
            --post-body-bg: white;
            --lang-btn-border: #cbd5e1;
            --lang-btn-active-bg: #2563eb;
            --lang-btn-active-color: white;
            --back-btn-color: #2563eb;
            --back-btn-bg: rgba(37, 99, 235, 0.08);
        }

        [data-theme="dark"] {
            --bg-body: #0b1120;
            --bg-container: rgba(20, 30, 50, 0.85);
            --border-container: rgba(255, 255, 255, 0.06);
            --shadow-container: 0 20px 50px -12px rgba(0, 0, 0, 0.6);
            --bg-profile: rgba(255, 255, 255, 0.04);
            --text-primary: #e8edf5;
            --text-secondary: #c8d0dc;
            --text-muted: #8895a8;
            --text-light: #5a6b7e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.04);
            --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            --card-hover-border: #3b82f6;
            --card-hover-shadow: 0 12px 28px -12px rgba(59, 130, 246, 0.2);
            --link-color: #60a5fa;
            --link-hover-bg: #3b82f6;
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-border: rgba(255, 255, 255, 0.1);
            --btn-hover-bg: #3b82f6;
            --code-bg: #1e293b;
            --code-text: #e2e8f0;
            --blockquote-border: #60a5fa;
            --blockquote-text: #a0b3cc;
            --post-body-bg: rgba(255, 255, 255, 0.03);
            --lang-btn-border: #334155;
            --lang-btn-active-bg: #3b82f6;
            --lang-btn-active-color: white;
            --back-btn-color: #60a5fa;
            --back-btn-bg: rgba(59, 130, 246, 0.15);
        }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            background: var(--bg-container);
            backdrop-filter: blur(12px);
            padding: 32px;
            border-radius: 40px;
            box-shadow: var(--shadow-container);
            border: 1px solid var(--border-container);
            align-items: start;
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
        }

        /* ===== 左侧个人名片 ===== */
        .profile {
            text-align: center;
            background: var(--bg-profile);
            padding: 30px 20px;
            border-radius: 28px;
            backdrop-filter: blur(4px);
            transition: background 0.3s;
        }
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 16px;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        .profile .tagline {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 14px;
        }
        .profile .bio {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .social-links a {
            text-decoration: none;
            background: var(--btn-bg);
            padding: 5px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            border: 1px solid var(--btn-border);
            transition: 0.2s;
        }
        .social-links a:hover {
            background: var(--link-hover-bg);
            color: white;
            border-color: var(--link-hover-bg);
            transform: translateY(-2px);
        }

        /* ===== 右侧主区域 ===== */
        .main-content {
            min-width: 0;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-bar h2 {
            font-weight: 600;
            font-size: 1.3rem;
            margin: 0;
            color: var(--text-primary);
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-switch {
            display: flex;
            gap: 4px;
        }
        .lang-switch button,
        .theme-toggle {
            background: none;
            border: 1px solid var(--lang-btn-border);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            background: var(--btn-bg);
            color: var(--text-primary);
            transition: 0.2s;
            font-weight: 500;
        }
        .lang-switch button.active {
            background: var(--lang-btn-active-bg);
            color: var(--lang-btn-active-color);
            border-color: var(--lang-btn-active-bg);
        }
        .lang-switch button:hover:not(.active),
        .theme-toggle:hover {
            background: var(--lang-btn-active-bg);
            color: white;
            border-color: var(--lang-btn-active-bg);
        }
        .theme-toggle {
            font-size: 1rem;
            padding: 4px 10px;
            line-height: 1;
        }

        #backBtn {
            display: none;
            background: none;
            border: none;
            color: var(--back-btn-color);
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 30px;
            background: var(--back-btn-bg);
            transition: 0.2s;
        }
        #backBtn.show {
            display: inline-block;
        }
        #backBtn:hover {
            background: var(--back-btn-color);
            color: white;
        }

        /* 文章列表卡片 */
        .post-item {
            background: var(--card-bg);
            padding: 18px 24px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 14px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
        }
        .post-item:hover {
            transform: translateX(6px);
            border-color: var(--card-hover-border);
            box-shadow: var(--card-hover-shadow);
        }
        .post-item h3 {
            font-weight: 600;
            margin-bottom: 2px;
            color: var(--text-primary);
        }
        .post-item .meta {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .post-item .desc {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 文章详情 */
        #postView {
            display: none;
        }
        #postView.active {
            display: block;
        }
        #postView .post-body {
            background: var(--post-body-bg);
            padding: 32px 36px;
            border-radius: 24px;
            line-height: 1.8;
            color: var(--text-primary);
        }
        #postView .post-body h1 {
            font-size: 2rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        #postView .post-body pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
        }
        #postView .post-body blockquote {
            border-left: 4px solid var(--blockquote-border);
            padding-left: 20px;
            color: var(--blockquote-text);
            margin: 16px 0;
        }
        #postView .post-meta {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        @media (max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            .profile {
                padding: 20px;
            }
            .header-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .header-controls {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <aside class="profile" id="profileContainer"></aside>
        <main class="main-content">
            <div class="header-bar">
                <h2 id="viewTitle">📖 文章目录</h2>
                <div class="header-controls">
                    <button id="backBtn"></button>
                    <span class="lang-switch">
                        <button class="active" data-lang="zhs">简</button>
                        <button data-lang="zht">繁</button>
                        <button data-lang="eng">EN</button>
                    </span>
                    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
                </div>
            </div>

            <div id="homeView">
                <div id="postList"></div>
            </div>

            <div id="postView">
                <div class="post-body">
                    <h1 id="detailTitle"></h1>
                    <div class="post-meta" id="detailMeta"></div>
                    <div id="detailContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        //  全部逻辑放在 DOMContentLoaded 中，确保元素已存在
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {

            // -------- 获取所有需要用到的 DOM 元素 --------
            const themeToggle = document.getElementById('themeToggle');
            const htmlElement = document.documentElement;
            const profileContainer = document.getElementById('profileContainer');
            const viewTitle = document.getElementById('viewTitle');
            const backBtn = document.getElementById('backBtn');
            const homeView = document.getElementById('homeView');
            const postView = document.getElementById('postView');
            const postList = document.getElementById('postList');
            const detailTitle = document.getElementById('detailTitle');
            const detailMeta = document.getElementById('detailMeta');
            const detailContent = document.getElementById('detailContent');
            const langButtons = document.querySelectorAll('.lang-switch button');

            // -------- 主题切换（带判空） --------
            function setTheme(theme) {
                if (!htmlElement) return;
                htmlElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                if (themeToggle) {
                    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
                }
            }

            // 加载保存的主题
            const savedTheme = localStorage.getItem('theme') || 'dark';
            setTheme(savedTheme);

            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    const current = htmlElement.getAttribute('data-theme') || 'dark';
                    setTheme(current === 'dark' ? 'light' : 'dark');
                });
            }

            // -------- 全局状态 --------
            let currentLang = 'zhs';
            let langData = null;
            let profileData = null;
            let manifestPosts = null;
            let POSTS = [];

            // -------- 工具函数 --------
            function getLangFromURL() {
                const params = new URLSearchParams(window.location.search);
                const lang = params.get('lang');
                return (lang === 'zhs' || lang === 'zht' || lang === 'eng') ? lang : 'zhs';
            }

            async function loadLang() {
                const res = await fetch('config/lang.json');
                if (!res.ok) throw new Error(`无法加载 config/lang.json (HTTP ${res.status})`);
                return await res.json();
            }

            async function loadProfile() {
                const res = await fetch('config/profile.json');
                if (!res.ok) throw new Error(`无法加载 config/profile.json (HTTP ${res.status})`);
                return await res.json();
            }

            async function loadManifest() {
                const res = await fetch('posts/manifest.json');
                if (!res.ok) throw new Error(`无法加载 posts/manifest.json (HTTP ${res.status})`);
                return await res.json();
            }

            function getText(obj) {
                if (typeof obj === 'string') return obj;
                if (obj && typeof obj === 'object') {
                    return obj[currentLang] || obj['zhs'] || '';
                }
                return '';
            }

            // -------- 渲染个人简介 --------
            function renderProfile() {
                if (!profileContainer) return;
                if (!langData || !profileData) {
                    profileContainer.innerHTML = `<p style="color: var(--text-muted);">⏳ 配置加载中...</p>`;
                    return;
                }

                const p = langData.profile || {};
                const socials = profileData.social || [];

                const socialHtml = socials.map(s => {
                    const labelObj = langData.social_labels && langData.social_labels[s.id];
                    const label = labelObj ? getText(labelObj) : s.id; // 降级显示 id
                    return `<a href="${s.url || '#'}" target="_blank">${label}</a>`;
                }).join('');

                profileContainer.innerHTML = `
                    <div class="avatar">
                        <img src="${profileData.avatar || 'images/avatar.jpg'}" alt="头像" />
                    </div>
                    <h1>${getText(p.name) || '未命名'}</h1>
                    <p class="tagline">${getText(p.tagline) || ''}</p>
                    <p class="bio">${getText(p.bio) || ''}</p>
                    <div class="social-links">${socialHtml}</div>
                `;
            }

            // -------- 文章数据更新（单语言） --------
            function updatePostsForCurrentLang() {
                if (!manifestPosts) {
                    POSTS = [];
                    return;
                }
                POSTS = manifestPosts.map(item => ({
                    id: item.id,
                    date: item.date,
                    title: item.title,
                    desc: item.desc
                }));
            }

            // -------- 渲染首页 --------
            function renderHome() {
                if (!homeView || !postView || !backBtn || !viewTitle || !postList) return;
                homeView.style.display = 'block';
                postView.classList.remove('active');
                backBtn.classList.remove('show');
                if (langData) {
                    backBtn.textContent = getText(langData.back_button);
                    viewTitle.textContent = getText(langData.nav_title);
                }

                if (POSTS.length === 0) {
                    postList.innerHTML = `<p style="color:var(--text-light);padding:20px;">${langData ? getText(langData.no_posts) : '暂无文章'}</p>`;
                    return;
                }
                postList.innerHTML = POSTS.map(p => `
                    <div class="post-item" onclick="window.openPost('${p.id}')">
                        <h3>${p.title}</h3>
                        <div class="meta">📅 ${p.date}</div>
                        <div class="desc">${p.desc}</div>
                    </div>
                `).join('');
            }

            // -------- 打开文章详情 --------
            window.openPost = async function(id) {
                const post = POSTS.find(p => p.id === id);
                if (!post) return;
                try {
                    const res = await fetch(`posts/${id}.md`);
                    if (!res.ok) throw new Error('文件不存在');
                    const md = await res.text();
                    const html = marked.parse(md);
                    if (detailTitle) detailTitle.textContent = post.title;
                    if (detailMeta) detailMeta.textContent = `📅 ${post.date}`;
                    if (detailContent) detailContent.innerHTML = html;
                } catch (e) {
                    if (detailTitle) detailTitle.textContent = post.title;
                    if (detailMeta) detailMeta.textContent = `📅 ${post.date}`;
                    if (detailContent) {
                        detailContent.innerHTML = `
                            <p>✍️ ${langData ? getText(langData.no_posts) : '文章内容缺失'}</p>
                            <p>请在 <code>posts/${id}.md</code> 中写入内容。</p>
                        `;
                    }
                }
                if (homeView) homeView.style.display = 'none';
                if (postView) postView.classList.add('active');
                if (backBtn) {
                    backBtn.classList.add('show');
                    if (langData) backBtn.textContent = getText(langData.back_button);
                }
                if (viewTitle && langData) viewTitle.textContent = getText(langData.reading_title);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // -------- 返回首页 --------
            if (backBtn) {
                backBtn.addEventListener('click', renderHome);
            }

            // -------- 语言切换 --------
            async function switchLanguage(lang) {
                if (lang === currentLang) return;
                currentLang = lang;
                const url = new URL(window.location);
                url.searchParams.set('lang', lang);
                window.history.pushState({}, '', url);

                renderProfile(); // 更新个人简介

                // 更新界面按钮文字
                if (postView && postView.classList.contains('active')) {
                    if (backBtn && langData) backBtn.textContent = getText(langData.back_button);
                    if (viewTitle && langData) viewTitle.textContent = getText(langData.reading_title);
                } else {
                    renderHome(); // 会更新首页所有文字
                }

                if (langData) document.title = getText(langData.site_title);

                // 高亮语言按钮
                langButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });
            }

            // -------- 初始化 --------
            async function init() {
                try {
                    langData = await loadLang();
                    profileData = await loadProfile();
                    manifestPosts = await loadManifest();

                    const initialLang = getLangFromURL();
                    currentLang = initialLang;
                    updatePostsForCurrentLang();
                    renderProfile();
                    renderHome();
                    if (langData) document.title = getText(langData.site_title);

                    // 语言按钮事件
                    langButtons.forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.lang === initialLang);
                        btn.addEventListener('click', function() {
                            switchLanguage(this.dataset.lang);
                        });
                    });

                    window.addEventListener('popstate', function() {
                        const newLang = getLangFromURL();
                        if (newLang !== currentLang) {
                            switchLanguage(newLang);
                        }
                    });

                } catch (e) {
                    console.error('初始化失败:', e);
                    if (profileContainer) {
                        profileContainer.innerHTML = `
                            <p style="color: #ef4444; padding: 20px;">
                                ⚠️ 加载配置失败，请检查控制台错误信息。<br>
                                <small style="font-size:0.8rem;">${e.message}</small>
                            </p>
                        `;
                    }
                    renderHome();
                }
            }

            init();
        });
    </script>

</body>
</html>
