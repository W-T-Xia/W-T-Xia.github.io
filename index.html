<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">加载中...</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: #1e293b;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            padding: 32px;
            border-radius: 40px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            align-items: start;
        }
        .profile {
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 30px 20px;
            border-radius: 28px;
            backdrop-filter: blur(4px);
        }
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 16px;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .profile .tagline {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 14px;
        }
        .profile .bio {
            font-size: 0.9rem;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 20px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .social-links a {
            text-decoration: none;
            background: white;
            padding: 5px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }
        .social-links a:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            transform: translateY(-2px);
        }

        .main-content {
            min-width: 0;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-bar h2 {
            font-weight: 600;
            font-size: 1.3rem;
            margin: 0;
        }
        .lang-switch {
            display: flex;
            gap: 6px;
        }
        .lang-switch button {
            background: none;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            background: white;
            transition: 0.2s;
            font-weight: 500;
        }
        .lang-switch button.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .lang-switch button:hover:not(.active) {
            background: #e2e8f0;
        }

        #backBtn {
            display: none;
            background: none;
            border: none;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 30px;
            background: rgba(37, 99, 235, 0.08);
        }
        #backBtn.show {
            display: inline-block;
        }

        .post-item {
            background: white;
            padding: 18px 24px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 14px;
            border: 1px solid rgba(0, 0, 0, 0.02);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .post-item:hover {
            transform: translateX(6px);
            border-color: #bfdbfe;
            box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.1);
        }
        .post-item h3 {
            font-weight: 600;
            margin-bottom: 2px;
        }
        .post-item .meta {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .post-item .desc {
            margin-top: 8px;
            color: #475569;
            font-size: 0.9rem;
        }

        #postView {
            display: none;
        }
        #postView.active {
            display: block;
        }
        #postView .post-body {
            background: white;
            padding: 32px 36px;
            border-radius: 24px;
            line-height: 1.8;
        }
        #postView .post-body h1 {
            font-size: 2rem;
            margin-bottom: 4px;
        }
        #postView .post-body pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
        }
        #postView .post-body blockquote {
            border-left: 4px solid #2563eb;
            padding-left: 20px;
            color: #475569;
            margin: 16px 0;
        }
        #postView .post-meta {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        @media (max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            .profile {
                padding: 20px;
            }
            .header-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .lang-switch {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左侧个人名片 -->
        <aside class="profile" id="profileContainer"></aside>

        <!-- 右侧主区域 -->
        <main class="main-content">
            <div class="header-bar">
                <h2 id="viewTitle">📖 文章目录</h2>
                <div>
                    <button id="backBtn"></button>
                    <span class="lang-switch">
                        <button class="active" data-lang="zhs">简</button>
                        <button data-lang="zht">繁</button>
                        <button data-lang="eng">EN</button>
                    </span>
                </div>
            </div>

            <div id="homeView">
                <div id="postList"></div>
            </div>

            <div id="postView">
                <div class="post-body">
                    <h1 id="detailTitle"></h1>
                    <div class="post-meta" id="detailMeta"></div>
                    <div id="detailContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        //  多语言 + 数据外挂 完整逻辑
        // ============================================================

        let currentLang = 'zhs';
        let langData = null;          // UI 语言数据
        let profileData = null;       // 社交链接数据
        let manifestPosts = null;     // 原始文章元数据（含多语言）
        let POSTS = [];               // 当前语言的文章列表（处理后）

        // -------- 工具：获取 URL 中的语言参数 --------
        function getLangFromURL() {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang');
            return (lang === 'zhs' || lang === 'zht' || lang === 'eng') ? lang : 'zhs';
        }

        // -------- 加载 UI 语言文件 --------
        async function loadLang() {
            const res = await fetch('config/lang.json');
            if (!res.ok) throw new Error('无法加载 config/lang.json');
            return await res.json();
        }

        // -------- 加载个人社交配置 --------
        async function loadProfile() {
            const res = await fetch('config/profile.json');
            if (!res.ok) throw new Error('无法加载 config/profile.json');
            return await res.json();
        }

        // -------- 加载文章元数据 --------
        async function loadManifest() {
            const res = await fetch('posts/manifest.json');
            if (!res.ok) throw new Error('无法加载 posts/manifest.json');
            return await res.json();
        }

        // -------- 工具：根据当前语言获取字段值 --------
        function getText(obj) {
            if (typeof obj === 'string') return obj;
            if (obj && typeof obj === 'object') {
                return obj[currentLang] || obj['zhs'] || '';
            }
            return '';
        }

        // -------- 渲染个人简介（含社交链接） --------
        function renderProfile() {
            const container = document.getElementById('profileContainer');
            const p = langData.profile;

            // 社交链接：从 profile.json 取 id 和 url，从 lang.json 取翻译名
            const socialHtml = profileData.social.map(s => {
                const label = getText(langData.social_labels[s.id]);
                return `<a href="${s.url}" target="_blank">${label}</a>`;
            }).join('');

            container.innerHTML = `
                <div class="avatar">
                    <img src="${profileData.avatar}" alt="头像" />
                </div>
                <h1>${getText(p.name)}</h1>
                <p class="tagline">${getText(p.tagline)}</p>
                <p class="bio">${getText(p.bio)}</p>
                <div class="social-links">${socialHtml}</div>
            `;
        }

        // -------- 根据当前语言更新文章列表 --------
        function updatePostsForCurrentLang() {
            if (!manifestPosts) return;
            POSTS = manifestPosts.map(item => ({
                id: item.id,
                date: item.date,
                title: getText(item.title),
                desc: getText(item.desc)
            }));
        }

        // -------- 渲染首页（文章列表） --------
        function renderHome() {
            document.getElementById('homeView').style.display = 'block';
            document.getElementById('postView').classList.remove('active');
            document.getElementById('backBtn').classList.remove('show');
            document.getElementById('backBtn').textContent = getText(langData.back_button);
            document.getElementById('viewTitle').textContent = getText(langData.nav_title);

            const list = document.getElementById('postList');
            if (POSTS.length === 0) {
                list.innerHTML = `<p style="color:#94a3b8;padding:20px;">${getText(langData.no_posts)}</p>`;
                return;
            }
            list.innerHTML = POSTS.map(p => `
                <div class="post-item" onclick="openPost('${p.id}')">
                    <h3>${p.title}</h3>
                    <div class="meta">📅 ${p.date}</div>
                    <div class="desc">${p.desc}</div>
                </div>
            `).join('');
        }

        // -------- 打开文章正文（正文不翻译） --------
        window.openPost = async function(id) {
            const post = POSTS.find(p => p.id === id);
            if (!post) return;

            try {
                const res = await fetch(`posts/${id}.md`);
                if (!res.ok) throw new Error('文件不存在');
                const md = await res.text();
                const html = marked.parse(md);

                document.getElementById('detailTitle').textContent = post.title;
                document.getElementById('detailMeta').textContent = `📅 ${post.date}`;
                document.getElementById('detailContent').innerHTML = html;
            } catch (e) {
                document.getElementById('detailTitle').textContent = post.title;
                document.getElementById('detailMeta').textContent = `📅 ${post.date}`;
                document.getElementById('detailContent').innerHTML = `
                    <p>✍️ ${getText(langData.no_posts)}</p>
                    <p>请在 <code>posts/${id}.md</code> 中写入内容。</p>
                `;
            }

            document.getElementById('homeView').style.display = 'none';
            document.getElementById('postView').classList.add('active');
            document.getElementById('backBtn').classList.add('show');
            document.getElementById('backBtn').textContent = getText(langData.back_button);
            document.getElementById('viewTitle').textContent = getText(langData.reading_title);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // -------- 返回首页 --------
        document.getElementById('backBtn').addEventListener('click', renderHome);

        // -------- 切换语言 --------
        async function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;

            // 更新 URL 参数
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.history.pushState({}, '', url);

            // 重新渲染所有界面
            renderProfile();
            updatePostsForCurrentLang();
            renderHome();
            document.title = getText(langData.site_title);

            // 高亮按钮
            document.querySelectorAll('.lang-switch button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // 如果当前在文章详情页，更新标题和日期（正文不变）
            const postView = document.getElementById('postView');
            if (postView.classList.contains('active')) {
                const titleEl = document.getElementById('detailTitle');
                const currentTitle = titleEl.textContent;
                const matched = POSTS.find(p => p.title === currentTitle);
                if (matched) {
                    titleEl.textContent = matched.title;
                    document.getElementById('detailMeta').textContent = `📅 ${matched.date}`;
                }
            }
        }

        // -------- 初始化 --------
        async function init() {
            try {
                // 加载所有数据
                langData = await loadLang();
                profileData = await loadProfile();
                manifestPosts = await loadManifest();

                // 获取初始语言
                const initialLang = getLangFromURL();
                currentLang = initialLang;

                // 更新文章列表（按当前语言）
                updatePostsForCurrentLang();

                // 渲染
                renderProfile();
                renderHome();
                document.title = getText(langData.site_title);

                // 高亮语言按钮
                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === initialLang);
                });

                // 绑定切换事件
                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        switchLanguage(btn.dataset.lang);
                    });
                });

                // 监听浏览器回退/前进
                window.addEventListener('popstate', () => {
                    const newLang = getLangFromURL();
                    if (newLang !== currentLang) {
                        switchLanguage(newLang);
                    }
                });

            } catch (e) {
                console.error('初始化失败:', e);
                alert('加载配置失败，请确保 config/ 和 posts/ 目录下的文件存在且格式正确。');
            }
        }

        init();
    </script>

</body>
</html>
