<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">加载中...</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== 样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            background: var(--bg-container);
            backdrop-filter: blur(12px);
            padding: 32px;
            border-radius: 40px;
            box-shadow: var(--shadow-container);
            border: 1px solid var(--border-container);
            align-items: start;
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
        }
        /* 其余样式与之前完全一致，请确保复制完整 */
        :root { /* 完整变量定义 */ }
        [data-theme="dark"] { /* 完整变量定义 */ }
        /* ... 所有样式保持不变，这里为了简洁省略，你直接复制之前的完整 style 块即可 */
    </style>
</head>
<body>
    <div class="container">
        <aside class="profile" id="profileContainer"></aside>
        <main class="main-content">
            <div class="header-bar">
                <h2 id="viewTitle">📖 文章目录</h2>
                <div class="header-controls">
                    <button id="backBtn"></button>
                    <span class="lang-switch">
                        <button class="active" data-lang="zhs">简</button>
                        <button data-lang="zht">繁</button>
                        <button data-lang="eng">EN</button>
                    </span>
                    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
                </div>
            </div>
            <div id="homeView"><div id="postList"></div></div>
            <div id="postView">
                <div class="post-body">
                    <h1 id="detailTitle"></h1>
                    <div class="post-meta" id="detailMeta"></div>
                    <div id="detailContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // -------- DOM 引用 --------
            const themeToggle = document.getElementById('themeToggle');
            const htmlElement = document.documentElement;
            const profileContainer = document.getElementById('profileContainer');
            const viewTitle = document.getElementById('viewTitle');
            const backBtn = document.getElementById('backBtn');
            const homeView = document.getElementById('homeView');
            const postView = document.getElementById('postView');
            const postList = document.getElementById('postList');
            const detailTitle = document.getElementById('detailTitle');
            const detailMeta = document.getElementById('detailMeta');
            const detailContent = document.getElementById('detailContent');
            const langButtons = document.querySelectorAll('.lang-switch button');

            // -------- 主题切换（带判空） --------
            function setTheme(theme) {
                if (!htmlElement) return;
                htmlElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                if (themeToggle) {
                    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
                }
            }
            const savedTheme = localStorage.getItem('theme') || 'dark';
            setTheme(savedTheme);
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    const current = htmlElement.getAttribute('data-theme') || 'dark';
                    setTheme(current === 'dark' ? 'light' : 'dark');
                });
            }

            // -------- 全局状态 --------
            let currentLang = 'zhs';
            let langData = null;
            let profileData = null;
            let manifestPosts = null;
            let POSTS = [];

            // -------- 工具函数 --------
            function getLangFromURL() {
                const params = new URLSearchParams(window.location.search);
                const lang = params.get('lang');
                return (lang === 'zhs' || lang === 'zht' || lang === 'eng') ? lang : 'zhs';
            }

            async function loadLang() {
                const res = await fetch('config/lang.json');
                if (!res.ok) throw new Error(`无法加载 config/lang.json (HTTP ${res.status})`);
                return await res.json();
            }

            async function loadProfile() {
                const res = await fetch('config/profile.json');
                if (!res.ok) throw new Error(`无法加载 config/profile.json (HTTP ${res.status})`);
                return await res.json();
            }

            async function loadManifest() {
                const res = await fetch('posts/manifest.json');
                if (!res.ok) throw new Error(`无法加载 posts/manifest.json (HTTP ${res.status})`);
                return await res.json();
            }

            function getText(obj) {
                if (typeof obj === 'string') return obj;
                if (obj && typeof obj === 'object') {
                    return obj[currentLang] || obj['zhs'] || '';
                }
                return '';
            }

            // -------- 渲染个人简介（增强：若标签缺失则显示 id 本身） --------
            function renderProfile() {
                if (!profileContainer) return;
                if (!langData || !profileData) {
                    profileContainer.innerHTML = `<p style="color: var(--text-muted);">⏳ 配置加载中...</p>`;
                    return;
                }

                const p = langData.profile || {};
                const socials = profileData.social || [];

                // 生成社交链接，如果 label 获取不到则显示 id 本身
                const socialHtml = socials
                    .filter(s => s.id) // 确保有 id
                    .map(s => {
                        const labelObj = langData.social_labels && langData.social_labels[s.id];
                        let label = labelObj ? getText(labelObj) : '';
                        // 如果 label 为空，则使用 id 本身（避免 undefined）
                        if (!label) label = s.id;
                        return `<a href="${s.url || '#'}" target="_blank">${label}</a>`;
                    }).join('');

                profileContainer.innerHTML = `
                    <div class="avatar">
                        <img src="${profileData.avatar || 'images/avatar.jpg'}" alt="头像" onerror="this.style.display='none'" />
                    </div>
                    <h1>${getText(p.name) || '未命名'}</h1>
                    <p class="tagline">${getText(p.tagline) || ''}</p>
                    <p class="bio">${getText(p.bio) || ''}</p>
                    <div class="social-links">${socialHtml}</div>
                `;
            }

            // -------- 其他渲染函数（与之前相同） --------
            function updatePostsForCurrentLang() {
                if (!manifestPosts) {
                    POSTS = [];
                    return;
                }
                POSTS = manifestPosts.map(item => ({
                    id: item.id,
                    date: item.date,
                    title: item.title,
                    desc: item.desc
                }));
            }

            function renderHome() {
                if (!homeView || !postView || !backBtn || !viewTitle || !postList) return;
                homeView.style.display = 'block';
                postView.classList.remove('active');
                backBtn.classList.remove('show');
                if (langData) {
                    backBtn.textContent = getText(langData.back_button);
                    viewTitle.textContent = getText(langData.nav_title);
                }
                if (POSTS.length === 0) {
                    postList.innerHTML = `<p style="color:var(--text-light);padding:20px;">${langData ? getText(langData.no_posts) : '暂无文章'}</p>`;
                    return;
                }
                postList.innerHTML = POSTS.map(p => `
                    <div class="post-item" onclick="window.openPost('${p.id}')">
                        <h3>${p.title}</h3>
                        <div class="meta">📅 ${p.date}</div>
                        <div class="desc">${p.desc}</div>
                    </div>
                `).join('');
            }

            window.openPost = async function(id) {
                const post = POSTS.find(p => p.id === id);
                if (!post) return;
                try {
                    const res = await fetch(`posts/${id}.md`);
                    if (!res.ok) throw new Error('文件不存在');
                    const md = await res.text();
                    const html = marked.parse(md);
                    if (detailTitle) detailTitle.textContent = post.title;
                    if (detailMeta) detailMeta.textContent = `📅 ${post.date}`;
                    if (detailContent) detailContent.innerHTML = html;
                } catch (e) {
                    if (detailTitle) detailTitle.textContent = post.title;
                    if (detailMeta) detailMeta.textContent = `📅 ${post.date}`;
                    if (detailContent) {
                        detailContent.innerHTML = `
                            <p>✍️ ${langData ? getText(langData.no_posts) : '文章内容缺失'}</p>
                            <p>请在 <code>posts/${id}.md</code> 中写入内容。</p>
                        `;
                    }
                }
                if (homeView) homeView.style.display = 'none';
                if (postView) postView.classList.add('active');
                if (backBtn) {
                    backBtn.classList.add('show');
                    if (langData) backBtn.textContent = getText(langData.back_button);
                }
                if (viewTitle && langData) viewTitle.textContent = getText(langData.reading_title);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            if (backBtn) {
                backBtn.addEventListener('click', renderHome);
            }

            // -------- 语言切换 --------
            async function switchLanguage(lang) {
                if (lang === currentLang) return;
                currentLang = lang;
                const url = new URL(window.location);
                url.searchParams.set('lang', lang);
                window.history.pushState({}, '', url);

                renderProfile();
                if (postView && postView.classList.contains('active')) {
                    if (backBtn && langData) backBtn.textContent = getText(langData.back_button);
                    if (viewTitle && langData) viewTitle.textContent = getText(langData.reading_title);
                } else {
                    renderHome();
                }
                if (langData) document.title = getText(langData.site_title);
                langButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });
            }

            // -------- 初始化 --------
            async function init() {
                try {
                    langData = await loadLang();
                    profileData = await loadProfile();
                    manifestPosts = await loadManifest();

                    const initialLang = getLangFromURL();
                    currentLang = initialLang;
                    updatePostsForCurrentLang();
                    renderProfile();
                    renderHome();
                    if (langData) document.title = getText(langData.site_title);

                    langButtons.forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.lang === initialLang);
                        btn.addEventListener('click', function() {
                            switchLanguage(this.dataset.lang);
                        });
                    });

                    window.addEventListener('popstate', function() {
                        const newLang = getLangFromURL();
                        if (newLang !== currentLang) {
                            switchLanguage(newLang);
                        }
                    });

                } catch (e) {
                    console.error('初始化失败:', e);
                    if (profileContainer) {
                        profileContainer.innerHTML = `
                            <p style="color: #ef4444; padding: 20px;">
                                ⚠️ 加载配置失败，请检查控制台错误信息。<br>
                                <small style="font-size:0.8rem;">${e.message}</small>
                            </p>
                        `;
                    }
                    renderHome();
                }
            }

            init();
        });
    </script>
</body>
</html>
