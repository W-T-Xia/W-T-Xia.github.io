<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夏文韬之个人博客</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== 全局重置 & 毛玻璃布局 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            color: #1e293b;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 32px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(20px);
            padding: 32px;
            border-radius: 48px;
            box-shadow: 0 30px 60px -20px rgba(0,20,40,0.25);
            border: 1px solid rgba(255,255,255,0.7);
        }

        /* ===== 左侧：Profile 名片 ===== */
        .profile {
            background: rgba(255,255,255,0.5);
            padding: 32px 24px;
            border-radius: 32px;
            text-align: center;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.8);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-weight: 300;
            box-shadow: 0 12px 24px -8px rgba(59,130,246,0.3);
        }
        .profile h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
        .profile .title { color: #64748b; font-size: 0.95rem; margin-bottom: 16px; }
        .profile .bio { font-size: 0.9rem; line-height: 1.6; color: #334155; margin-bottom: 20px; }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .social-links a {
            text-decoration: none;
            background: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e293b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }
        .social-links a:hover { 
            background: #3b82f6; 
            color: white; 
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        /* ===== 右侧：博客区域 ===== */
        .main-content { min-width: 0; }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .header-bar h2 { font-weight: 600; font-size: 1.4rem; }
        .back-btn {
            display: none;
            background: none;
            border: none;
            color: #3b82f6;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 6px 12px;
            border-radius: 40px;
            background: rgba(59,130,246,0.08);
        }
        .back-btn.show { display: inline-block; }

        .post-list { display: flex; flex-direction: column; gap: 16px; }
        .post-item {
            background: white;
            padding: 20px 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .post-item:hover {
            transform: translateX(6px);
            box-shadow: 0 12px 28px -12px rgba(0,0,0,0.12);
            border-color: #dbeafe;
        }
        .post-item h3 { font-weight: 600; margin-bottom: 4px; }
        .post-item .meta { font-size: 0.8rem; color: #94a3b8; }
        .post-item .desc { margin-top: 8px; color: #475569; font-size: 0.9rem; }

        #post-view { display: none; }
        #post-view.active { display: block; }
        #post-view .post-body {
            background: white;
            padding: 32px 36px;
            border-radius: 24px;
            line-height: 1.8;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        #post-view .post-body h1 { font-size: 2rem; margin-bottom: 8px; }
        #post-view .post-body pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
        }
        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左侧个人信息（改成你自己的） -->
    <aside class="profile">
        <div class="avatar">🧑‍💻</div>
        <h1>夏文韬</h1>
        <p class="title">全栈开发者 · 终身学习者</p>
        <p class="bio">热爱技术写作，这里记录我的思考与成长。</p>
        <div class="social-links">
            <a href="#">GitHub</a>
            <a href="#">Twitter</a>
            <a href="#">邮箱</a>
        </div>
    </aside>

    <!-- 右侧内容 -->
    <main class="main-content">
        <div class="header-bar">
            <h2 id="view-title">📖 最新文章</h2>
            <button class="back-btn" id="backBtn">← 返回列表</button>
        </div>

        <div id="home-view">
            <div class="post-list" id="postList"></div>
        </div>

        <div id="post-view">
            <div class="post-body">
                <h1 id="detailTitle"></h1>
                <div class="post-meta" id="detailMeta"></div>
                <div id="detailContent"></div>
            </div>
        </div>
    </main>
</div>

<script>
    // ===== 文章数据（以后新增文章就在这里加一条） =====
    const POSTS = [
        {
            id: "hello-world",
            title: "Hello World，我的第一篇文章",
            date: "2026-07-30",
            desc: "我的个人网站正式上线了！"
        }
    ];

    // ===== 渲染逻辑 =====
    const homeView = document.getElementById('home-view');
    const postView = document.getElementById('post-view');
    const postList = document.getElementById('postList');
    const backBtn = document.getElementById('backBtn');
    const viewTitle = document.getElementById('view-title');

    function renderHome() {
        homeView.style.display = 'block';
        postView.classList.remove('active');
        backBtn.classList.remove('show');
        viewTitle.textContent = '📖 最新文章';

        postList.innerHTML = POSTS.map(p => `
            <div class="post-item" onclick="openPost('${p.id}')">
                <h3>${p.title}</h3>
                <div class="meta">${p.date}</div>
                <div class="desc">${p.desc}</div>
            </div>
        `).join('');
    }

    window.openPost = async function(id) {
        const post = POSTS.find(p => p.id === id);
        if (!post) return;

        try {
            // 尝试加载 posts/ 文件夹下的同名 .md 文件
            const res = await fetch(`posts/${id}.md`);
            const md = await res.text();
            document.getElementById('detailContent').innerHTML = marked.parse(md);
        } catch (e) {
            // 如果还没创建 .md 文件，显示占位提示
            document.getElementById('detailContent').innerHTML = `
                <p>📝 正在准备内容...</p>
                <p>请在 <code>posts/${id}.md</code> 文件中写下你的第一篇博客。</p>
            `;
        }
        document.getElementById('detailTitle').textContent = post.title;
        document.getElementById('detailMeta').textContent = `📅 ${post.date}`;

        homeView.style.display = 'none';
        postView.classList.add('active');
        backBtn.classList.add('show');
        viewTitle.textContent = '📄 阅读文章';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    backBtn.addEventListener('click', renderHome);
    renderHome();
</script>
</body>
</html>
